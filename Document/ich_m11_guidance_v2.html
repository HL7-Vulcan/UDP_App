  {code:"C218786",term:"Reportable Period End",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218787",term:"Timing for Reporting to Sponsor or Designee",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218788",term:"Method for Reporting",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218789",term:"Back-up Method for Reporting",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218791",term:"Event Collection and Reporting Timing",guidance:`Specify timing for collection and reporting, including: •   start and end dates for collection and reporting •   frequency of collection and reporting • cross reference to the Schedule of Assessments as appropriate`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218792",term:"Severity",guidance:`Specify how information will be identified (e.g., self-reported, solicited questions).`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218793",term:"Follow-up",guidance:`Specify procedures for recording.`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218794",term:"Follow-up",guidance:`Specify the procedures for follow-up. Include the assessment tools that will be used to monitor the events and the duration of follow-up after appearance of the events.`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218795",term:"Reporting",guidance:`Specify the reporting method (e.g., an electronic data collection tool or a paper CRF), backup reporting method, if applicable, and reporting timeline to the sponsor.`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218796",term:"Regulatory Reporting Requirements",guidance:`Specify: •   the investigator’s responsibilities for reporting to the sponsor (and to ethics committees, where required), specifying timing of reporting to allow the sponsor to meet their responsibilities •   the sponsor’s legal/regulatory responsibilities for reporting to regulatory authorities, ethics committees, and investigators • suspected unexpected serious adverse reaction reporting`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218797",term:"Disease-related Events or Outcomes Not Qualifying as AEs or SAEs",guidance:``,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218798",term:"Participants Who Become Pregnant During the Trial",guidance:`Specify: •    the assessments to be performed •    type and duration of monitoring •    whether participants who become pregnant during the trial may continue with trial intervention or must be discontinued from trial intervention (refer to Section 7 Participant Discontinuation of Trial Intervention and Discontinuation or Withdrawal from Trial as applicable) •    any trial modifications that need to be made for participants who become pregnant •    what information will be collected about a participant who becomes pregnant during the trial (e.g., recording and reporting to the sponsor, postpartum follow-up, trial intervention discontinuation or continuation, or trial withdrawal) For postpartum follow-up, include the time period (e.g., initial child development) with justification. If exposure to trial intervention during breastfeeding is applicable, specify: •    the assessments to be performed •    type and duration of monitoring • information to be collected for both the participant and child`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218799",term:"Participants Whose Partners Become Pregnant During the Trial",guidance:`Specify: •    whether the investigator will attempt to collect pregnancy information about a participant’s partner who becomes pregnant during the specified period in the trial •    whether the participant whose partner becomes pregnant should be discontinued from trial intervention (refer to Section 7 Participant Discontinuation of Trial Intervention and Discontinuation or Withdrawal from Trial as applicable) •    the assessments to be performed, type and duration of monitoring, and the information to be collected`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218800",term:"Special Safety Situations",guidance:`Specify special safety situations associated with the trial intervention(s) that do not qualify as an AE or SAE but require regulatory reporting. Examples include: •    misuse or abuse •    off-label use (if applicable) •    medication error (prescription or dispensing error) •    occupational exposure •    use outside of what is foreseen in the protocol •    unintended exposure of embryo, foetus, or child via maternal exposure (pregnancy or breastfeeding) or via paternal exposure (semen) •    lack of therapeutic efficacy; this is not applicable for studies that measure efficacy as a study endpoint •    suspected transmission of an infectious agent; this is only applicable for injected or biologic medicinal products •    product complaint, including falsified or counterfeit products • suspected drug-food or drug-drug interaction`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218801",term:"",guidance:`Describe analysis sets to be considered at the trial level, i.e., the set of participants whose data are to be included in the analyses, aligned with estimands. Clearly specify the analysis set to be used for each analysis described in Section 10 Statistical Considerations.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218802",term:"",guidance:`Describe the summary statistics that will be used to characterise the distribution of demographic and other relevant variables at baseline. Specify when the variables will be measured (e.g., at trial inclusion, prior to randomisation, or at the time of randomisation). Relevant variables include but are not limited to: stratification variables specified in Section 6.7 Investigational Trial Intervention Assignment, Randomisation and Blinding, covariates for the statistical models specified in Section 10.4 Analyses Associated with the Primary Objective(s), other suspected predictive or prognostic variables, and variables used for planned subgroup analyses.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218803",term:"",guidance:`For each intercurrent event of the primary estimand(s) defined in Section 3.1 Primary Objective(s) and Associated Estimand(s), explain how data will be handled for the statistical analysis in line with the primary estimand. The handling of intercurrent events in the statistical analysis should be aligned with the specific estimand strategies being used. This section should describe in more detail the rationale and handling of the data rather than repeating information from the preceding sections.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218804",term:"",guidance:`Describe how missing data will be addressed (e.g., imputation method and model), state the underlying assumptions, and provide a rationale for the approach.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218808",term:"",guidance:`If safety is a primary and/or secondary objective, describe the corresponding safety analyses in the appropriate section above (Section 10.4 Analyses Associated with the Primary Objective[s] or Section 10.5 Analyses Associated with the Secondary Objective[s]). In this section, describe statistical methods that will be used to analyse relevant safety outcomes, including any AESI. This should typically include specification of a measure to estimate risk within treatment arms, a measure to compare risks across treatment arms, and a measure of statistical uncertainty around the comparison (e.g., a confidence interval).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218809",term:"",guidance:`Describe other analyses not included in Sections 10.3-10.7, such as subgroup analyses.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218810",term:"",guidance:`Multiple testing procedures may be needed to limit the probability of false positive findings in a trial. Reasons for carrying out multiple statistical tests include, but are not restricted to, multiple endpoints, multiple treatment groups, multiple hypotheses, subgroups, and multiple timepoints. Describe any approaches to multiplicity control for the trial. This description might go beyond the analysis of primary objectives. Specify the statistical approach to control the overall type I error rate as well as the (adjusted) significance levels to test specific hypotheses, as applicable. Clarify whether the tests/confidence intervals are one- or two-sided. State the circumstances under which a trial will be considered to have met its primary objective(s). For example, in a study with two primary efficacy endpoints, this section should state whether the study would be expected to provide statistical evidence on at least one or on both of the endpoints in order to confirm the efficacy of the treatment. For some statistical approaches it might be helpful to include a graphical depiction, as visualisation will be helpful for understanding, coupled with the clinical translation of the mathematical choices. Details regarding interim analyses should be provided in Section 10.9 Interim Analyses.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218811",term:"Regulatory and Ethical Considerations",guidance:`Provide a high-level statement on the prevailing ethical, legal, and regulatory guidelines that will be applied throughout the trial. This trial will be conducted in accordance with the protocol and with the following: • Ethical principles that have their origin in the Declaration of Helsinki for medical research involving human subjects • Consensus ethical principles derived from international guidelines including the Declaration of Helsinki and the Council for International Organisations of Medical Sciences (CIOMS) International Ethical Guidelines • ICH Good Clinical Practice (GCP) Guidelines • Applicable laws and regulations`,sections:["Section 11 \u2013 Regulatory & Ethical Considerations"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218812",term:"",guidance:`Concisely summarise the trial oversight, listing the investigator and sponsor responsibilities not covered in other sections of the protocol that are essential for trial conduct, specifying the ones related to quality assurance. if not using below optional subheadings.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218813",term:"",guidance:`Describe the investigator responsibilities, including the oversight of trial-related activities delegated to a third party that may impact the trial conduct at sites, if applicable and if not addressed elsewhere.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218814",term:"",guidance:`Describe the sponsor responsibilities, including activities to be transferred to a third party that may impact the investigator sites, if applicable.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218815",term:"Description of Emergency Consent Process",guidance:`Specify the key elements of the informed consent process, including any special needs and how these are addressed (e.g., assent, capacity, legally acceptable representative, adolescents who may reach age of majority during the trial, pregnant participants and pregnant partners of participants).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218816",term:"",guidance:`If enrollment in the trial may occur during an emergency in which the participant or their legally acceptable representative is not able or available to give consent, describe the consent process.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218817",term:"",guidance:`If participants can be rescreened as described in Section 5.6 Screen Failure and Rescreening, state whether the participant needs to complete a new ICF. Screen failure and rescreening should be clearly defined in the protocol, with a cross reference to those definitions.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218820",term:"",guidance:`Concisely summarise the arrangements for participant insurance and indemnity if not addressed in a separate agreement, if required by the applicable regulatory requirements.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218821",term:"",guidance:`Describe the identified critical to quality factors, associated risks and risk mitigation strategies for the trial or refer to the location where this is described and updated during the trial based on emerging data.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218822",term:"",guidance:`Describe the key systems and processes for critical trial integrity, traceability and security including a summary of the approaches enabling accurate data collection, reporting, monitoring, transfer, retention, and access if not addressed in separate agreement(s).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218823",term:"",guidance:`Describe the measures to protect the privacy and confidentiality of personal information of trial participants in accordance with applicable regulatory requirements on personal data protection and any measures that should be taken in case of a data security breach.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218825",term:"Trial Monitor Expectations for Source Records",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218826",term:"Identification of Source Records",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218827",term:"",guidance:`Describe plans for detecting, reviewing, and reporting any deviations from the protocol or include reference to a separate document.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218828",term:"",guidance:`List the sponsor’s rights to close a site early. Likewise, list the investigator’s rights to initiate early site closure.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218829",term:"Responsibilities Following Early Site Closure",guidance:`List the criteria for early closure of a site by the sponsor or investigator.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218830",term:"",guidance:`List the responsibilities of the sponsor and investigator following early site closure (e.g., informing the ethics committee[s], and prompt notification of the participant and their transition to appropriate therapy and/or follow-up).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218831",term:"",guidance:`Describe whether the clinical trial will be registered in public databases, including reporting of results, if applicable.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218832",term:"Country/Region-Specific Requirements",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218833",term:"Country/Region-Specific Protocol Clarifications",guidance:`Although global clinical trial practices are increasingly harmonised, some country/ region-specific differences in requirements do exist (e.g., document retention periods, contraception requirements). Where differences in requirements cannot be reconciled, the sponsor should explain how they will document and communicate country/region-specific differences (e.g., by country/region-specific amendments or addenda). An alternative to country/region-specific amendments is to list the specific differences by country or countries in this section, including a reference to the relevant section of the protocol where the differing requirement applies.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218835",term:"",guidance:`Choose the applicable statement below. For an original protocol that has not been amended, retain the first statement below and delete the remainder of this entire section. {This protocol has not been amended.} Or {This is the first protocol amendment.} Or include the below as applicable. {This protocol has been amended previously. The Protocol Amendment Summary of Changes for the current amendment is located directly before the Table of Contents. Prior amendment(s) to this protocol are listed in the table below, beginning with the most recent.}`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218836",term:"Alternate Location for Overview of Changes",guidance:`?? If the overview of prior amendments is held in an alternative location rather than inline in this section, specify that location here.`,sections:["Section 12 \u2013 Other Protocol Considerations"],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C218837",term:"Glossary of Terms and Abbreviations",guidance:`Define abbreviations and other terms used in the protocol. A tabular presentation is common and may serve as the definition at first use.`,sections:["Section 13 \u2013 Glossary"],appAuthored:false,needsClarif:false,hasGuidance:true},

const SECTIONS = ["Title Page", "Amendment Details", "Objectives Block", "Section 1 \u2013 Protocol Identification", "Section 2 \u2013 Protocol Summary", "Section 4 \u2013 Trial Objectives & Endpoints", "Section 5 \u2013 Overall Design", "Section 6 \u2013 Trial Population", "Section 7 \u2013 Treatments", "Section 8 \u2013 Assessments & Procedures", "Section 9 \u2013 Safety Reporting", "Section 10 \u2013 Statistical Considerations", "Section 11 \u2013 Regulatory & Ethical Considerations", "Section 12 \u2013 Other Protocol Considerations", "Section 13 \u2013 Glossary", "Section 14 \u2013 References"];

// Populate section filter
const secSel = document.getElementById('section-filter');
SECTIONS.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  secSel.appendChild(opt);
});

// State
let activeFilter = 'all';
let activeSection = '';
let searchQuery = '';

// Render
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAll() {
  const q = searchQuery.toLowerCase();
  const list = document.getElementById('field-list');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('result-count');

  let matched = FIELDS.filter(f => {
    // Status filter
    if (activeFilter === 'has-guidance' && !f.hasGuidance) return false;
    if (activeFilter === 'no-guidance' && f.hasGuidance) return false;
    if (activeFilter === 'app-authored' && !f.appAuthored) return false;
    // Section filter
    if (activeSection && !f.sections.includes(activeSection)) return false;
    // Search
    if (q) {
      const hay = (f.code + ' ' + f.term + ' ' + f.guidance).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  countEl.textContent = matched.length === FIELDS.length
    ? '' : `Showing ${matched.length} of ${FIELDS.length}`;

  if (!matched.length) {
    list.innerHTML = '';
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  list.innerHTML = matched.map(f => {
    const tags = [];
    if (f.appAuthored) tags.push('<span class="tag tag-app">App-authored</span>');
    if (!f.hasGuidance) tags.push('<span class="tag tag-miss">No guidance</span>');
    if (f.needsClarif) tags.push('<span class="tag tag-note">Needs clarification</span>');

    // Show first 2 section badges in header, rest in body
    const secBadges = f.sections.map(s => `<span class="tag tag-sec">${escHtml(s)}</span>`);
    const headerSecs = secBadges.slice(0, 2).join('');
    const moreSecs = f.sections.length > 2 ? `<span class="tag" style="background:var(--border);color:var(--muted)">+${f.sections.length - 2} more</span>` : '';
    const allSecBadges = secBadges.join('');

    const metaHtml = [tags.join(''), headerSecs, moreSecs].filter(Boolean).join('');

    const guidanceHtml = f.hasGuidance
      ? `<div class="guidance-text">${escHtml(f.guidance)}</div>`
      : `<div class="guidance-text missing">No guidance text defined for this field.</div>`;

    const bodySecs = f.sections.length
      ? `<div class="body-sections"><span class="body-sections-label">Used in:</span>${allSecBadges}</div>`
      : '';

    return `<div class="field-card" data-code="${f.code}">
  <div class="field-header" onclick="toggle(this)">
    <div class="field-header-left">
      <div class="field-code">${escHtml(f.code)}</div>
      <div class="field-term">${escHtml(f.term || '(no term)')}</div>
      ${metaHtml ? `<div class="field-meta">${metaHtml}</div>` : ''}
    </div>
    <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M5 7.5l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="field-body">
    ${guidanceHtml}
    ${bodySecs}
  </div>
</div>`;
  }).join('');
}

function toggle(header) {
  const card = header.closest('.field-card');
  card.classList.toggle('open');
}

// Events
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderAll();
});

document.getElementById('status-filters').addEventListener('click', e => {
  const btn = e.target.closest('.fbtn');
  if (!btn) return;
  document.querySelectorAll('#status-filters .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderAll();
});

secSel.addEventListener('change', e => {
  activeSection = e.target.value;
  renderAll();
});

// Initial render
renderAll();
</script>
