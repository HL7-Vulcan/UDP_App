<title>ICH M11 Field Guidance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ── Tokens ── */
:root {
  --bg:       #f7f8fa;
  --surface:  #ffffff;
  --border:   #e2e5ea;
  --text:     #1a1d23;
  --muted:    #6b7280;
  --accent:   #1a56db;
  --accent-bg:#eff4ff;
  --tag-app:  #0e9f6e;
  --tag-app-bg:#def7ec;
  --tag-miss: #d03801;
  --tag-miss-bg:#fde8d8;
  --tag-note: #7e3af2;
  --tag-note-bg:#edebfe;
  --sec-bg:   #f0f4ff;
  --sec-fg:   #1e40af;
  --sec-border:#bfdbfe;
  --shadow:   0 1px 3px rgba(0,0,0,.08);
  --radius:   8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #1a1d26; --border: #2d3141;
    --text: #e8eaf0; --muted: #9499a8; --accent: #6ea8fe;
    --accent-bg: #1a2a4a; --tag-app: #31c48d; --tag-app-bg: #064e3b;
    --tag-miss: #f98080; --tag-miss-bg: #7f1d1d;
    --tag-note: #ac94fa; --tag-note-bg: #3b0764;
    --sec-bg: #1e2a4a; --sec-fg: #93c5fd; --sec-border: #1e3a6e;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #1a1d26; --border: #2d3141;
  --text: #e8eaf0; --muted: #9499a8; --accent: #6ea8fe;
  --accent-bg: #1a2a4a; --tag-app: #31c48d; --tag-app-bg: #064e3b;
  --tag-miss: #f98080; --tag-miss-bg: #7f1d1d;
  --tag-note: #ac94fa; --tag-note-bg: #3b0764;
  --sec-bg: #1e2a4a; --sec-fg: #93c5fd; --sec-border: #1e3a6e;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

/* ── Reset / Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.6;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}

/* ── Header ── */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px);
  background: var(--surface); border-bottom: 1px solid var(--border);
  z-index: 20; padding: 12px 0 10px;
  box-shadow: var(--shadow);
}
.header-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
}
.header-top {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.header-top h1 {
  font-size: 17px; font-weight: 600; letter-spacing: -.01em;
  color: var(--text);
}
.stats { font-size: 12px; color: var(--muted); }

/* ── Search ── */
.search-row {
  display: flex; gap: 8px;
}
#search {
  flex: 1; padding: 7px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text);
  font-family: inherit; font-size: 13px;
  outline: none; transition: border-color .15s;
  min-width: 0;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

/* ── Filter bar ── */
.filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.filter-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.filter-row {
  display: flex; gap: 5px; flex-wrap: wrap;
}
.fbtn {
  padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); font-size: 12px; font-family: inherit;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.fbtn:hover { border-color: var(--accent); color: var(--accent); }
.fbtn.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff; font-weight: 500;
}
.section-select {
  padding: 4px 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font-family: inherit; font-size: 12px;
  cursor: pointer; outline: none; max-width: 280px;
}
.section-select:focus { border-color: var(--accent); }

/* ── Count display ── */
.result-count { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── Main ── */
.main { max-width: 960px; margin: 0 auto; padding-top: 18px; }

/* ── Field card ── */
.field-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 10px;
  box-shadow: var(--shadow); overflow: hidden;
}
.field-header {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; cursor: pointer;
  user-select: none; gap: 10px;
}
.field-header:hover { background: var(--accent-bg); }
.field-header-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.field-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 500; color: var(--muted);
  letter-spacing: .04em;
}
.field-term { font-size: 14px; font-weight: 500; color: var(--text); }
.field-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 7px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.tag-app   { background: var(--tag-app-bg);  color: var(--tag-app); }
.tag-miss  { background: var(--tag-miss-bg); color: var(--tag-miss); }
.tag-note  { background: var(--tag-note-bg); color: var(--tag-note); }
.tag-sec {
  background: var(--sec-bg); color: var(--sec-fg);
  border: 1px solid var(--sec-border);
  padding: 1px 7px; border-radius: 12px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.chevron {
  flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px;
  color: var(--muted); transition: transform .2s;
}
.field-card.open .chevron { transform: rotate(180deg); }

/* ── Expanded body ── */
.field-body {
  display: none; border-top: 1px solid var(--border);
  padding: 14px 14px 16px;
}
.field-card.open .field-body { display: block; }
.guidance-text {
  font-size: 13px; color: var(--text); line-height: 1.7;
  white-space: pre-wrap;
}
.guidance-text.missing { color: var(--muted); font-style: italic; }
.body-sections { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.body-sections-label { font-size: 11px; color: var(--muted); font-weight: 500; }

/* ── Empty state ── */
.empty {
  text-align: center; padding: 60px 20px;
  color: var(--muted); font-size: 14px;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .header-top { flex-direction: column; gap: 4px; }
  .filter-bar { flex-direction: column; align-items: flex-start; gap: 4px; }
  .section-select { max-width: 100%; }
}
</style>

<script>
const FIELDS = [
  {code:"C112038",term:"Control Description",guidance:``,sections:["Section 1 \u2013 Protocol Identification"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C115467",term:"",guidance:`This section should detail the methods used for the determination of the sample size. The sample size calculation should be aligned with the primary estimand(s) and the primary analysis; otherwise, a justification is needed. Details of sample size calculation should include all relevant information to enable reproduction of the sample size, e.g.: • references to any prior studies on which assumptions were based • significance level (including information on the choice of one- or two-sided level) • power • assumed treatment effect and variability • how dropout rate and intercurrent events have been incorporated into sample size calculation • precision of estimator/length of confidence interval Any assumptions made should be stated and justified. Further analysis of how deviations from the assumptions will affect the sample size should be included. If complex simulations were used to calculate the sample size, consider including details in a separate simulation report as an appendix to the protocol. If the planned sample size is not derived statistically, then this should be explicitly stated along with a rationale for the intended sample size (e.g., exploratory nature of pilot trials; pragmatic considerations for trials in rare diseases).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C115525",term:"Storage and Handling of Investigational Trial Intervention",guidance:`Describe storage and handling requirements (e.g., protection from light, temperature, humidity) for the investigational trial intervention(s). For trials in which multidose vials are utilised, provide additional information regarding stability and expiration time after initial use (e.g., if the seal is broken). Explain how the investigational trial intervention will be provided to the investigator. If applicable, include details about kits, packaging, or other material of the investigational trial intervention for blinding purposes. If the instructions are lengthy or complicated, it is acceptable to reference the package insert (if applicable) or include instructions in separate documents provided to the site (e.g., a pharmacy manual) and reference the separate documents.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C132346",term:"Trial Acronym",guidance:`The protocol should have a descriptive title that identifies the scientific aspects of the trial sufficiently to ensure it is immediately evident what the trial is investigating and on whom, and to allow retrieval from literature or internet searches.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C132349",term:"Schedule of Activities",guidance:`The schedule of activities must capture the procedures that will be accomplished at each trial visit, and all contact with participants (e.g., telephone contacts). This includes any tests that are used for eligibility, participant randomisation or stratification, or decisions on trial intervention discontinuation. Allowable windows should be stated for all visits and procedures. A tabular format is recommended. When applicable for studies with extensive sampling (e.g., serial PK sampling), a separate table may be added.`,sections:["Section 1 \u2013 Protocol Identification"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C132351",term:"Original Protocol",guidance:`A unique alphanumeric identifier for the trial, designated by the sponsor.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C132352",term:"Sponsor Signatory",guidance:`Requires Clarification`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C142517",term:"Dosage Level(s)",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C142582",term:"",guidance:`Describe any interim analyses and criteria for stopping or adapting the trial. Ensure alignment with Section 4.3 Trial Stopping Rules. The description should include, but is not limited to, the following. Under circumstances where interim analysis details could impede the integrity of the trial, some of the information can be added in other documents outside of the protocol. • any planned interim analysis, even if it is only to be performed at the request of an oversight body (for example, DMC) • the purpose of the interim analysis, including whether the interim analysis may be used for stopping and/or other trial adaptations (e.g., sample size re- estimation, alteration to the proportion of participants allocated to each trial group, or changes to eligibility criteria) • the applied statistical method (e.g., group sequential test) and spending function (e.g., O’Brien-Fleming), as applicable • the parties responsible for performing and reviewing the results of the analyses (e.g., DMC, independent statistician) • when the analyses will be conducted (timing and/or triggers) • the decision criteria—statistical or other—that will be adopted to judge the interim results as part of a guideline for early stopping or other adaptations • who will see the outcome data while the trial is ongoing • whether these individuals will remain blinded to trial groups • how the integrity of the trial will be protected (e.g., maintaining blinding) when decisions are made after interim analyses (e.g., a decision to continue the trial or implement a specific adaptation)`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C142585",term:"",guidance:`Further clarification: • Control Description: if active comparator or low dose, pick nonproprietary name or International Nonproprietary Name; indicate "Not applicable" if not applicable`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C142698",term:"Trial Stopping Rules",guidance:`If applicable, describe any trial-specific stopping rules, including guidance on when the trial should be stopped for efficacy or safety reasons, when a cohort or dose escalation should be terminated, and/or when a given treatment arm should be terminated. If applicable, describe any rules that may result in a temporary pause of dosing and/or enrollment into the trial and criteria for restarting enrollment. Ensure that the trial-specific stopping rules are aligned with the specifications that are described in Section 10.9 Interim Analyses.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C142705",term:"Overall Rationale for Trial Design",guidance:`if not using below optional subheadings.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C146997",term:"Purpose of Trial",guidance:`Explain why the trial is needed, and why the research questions being asked are important. Do not restate the objectives or estimands. Do not restate the IB; rather, cross reference to the IB as applicable to the description.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C147139",term:"Overall Description of Trial Design and Description of Intervention Model",guidance:`Describe the overall trial design and intervention model (e.g., single group, parallel group, cross-over, factorial, sequential), the expected number of participants, and the control method (e.g., placebo, active comparator, low dose, external, standard of care, sham procedure, or none [uncontrolled]). If there are any key aspects of the investigational trial intervention that inform the selection of the intervention model, this should be described. If applicable, indicate other design characteristics (e.g., superiority, noninferiority, dose escalation, or equivalence). If the trial will have an adaptive or novel design (e.g., the trial will be conducted under a master protocol), provide a summary of these design aspects. If applicable, describe within-trial transition rules (e.g., transitions involving cohorts or trial parts). Dose escalation or dose-ranging details should also be described.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C154628",term:"Vital Signs",guidance:`Include any specific instructions for the collection and interpretation of vital signs.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C15697",term:"Use",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C163559",term:"",guidance:`?? <strong>Optional.</strong> If provided, the Endpoint field becomes required.`,sections:[],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C164387",term:"General Considerations",guidance:``,sections:["Section 10 \u2013 Statistical Considerations"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C168186",term:"Electrocardiograms",guidance:`Include any specific instructions for the collection, interpretation, and archiving of ECGs.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C172240",term:"NMPA IND Number",guidance:``,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C172457",term:"Intervention Name",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C176267",term:"Accountability of Investigational Trial Intervention",guidance:`Describe the accountability method, including: • how the investigational trial intervention will be distributed • who will distribute the investigational trial intervention • participation of a drug storage repository or pharmacy, if applicable • plans for disposal or return of unused product • plans for reconciliation of investigational trial intervention, if applicable`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C176274",term:"Preparation of Investigational Trial Intervention",guidance:`Describe any preparation of the investigational trial intervention, and when necessary, who should prepare it. When applicable, describe the maximum hold time once thawed/mixed before administration. Include thawing, diluting, mixing, and reconstitution/preparation instructions. For drug/device combination products, include any relevant assembly or use instructions and reference the package insert that is provided separately. If the instructions are lengthy or complicated, it is acceptable to reference the package insert (if applicable) or include instructions in separate documents provided to the site (e.g., a pharmacy manual) and reference the separate documents.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C17649",term:"Primary Reason for Amendment Other",guidance:`?? Provide description if Other was selected`,sections:["Amendment Details", "Title Page"],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C17649_2",term:"Secondary Reason for Amendment Other",guidance:`?? Provide description if Other was selected`,sections:["Amendment Details", "Title Page"],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C176849",term:"Medical Resource Utilisation and Health Economics",guidance:`This section does not apply to COAs. Include this section only for any value evidence and outcomes assessments not included in either the efficacy or safety sections. Describe the health outcome measures, collection method (e.g., diary, physician interview), and participant burden.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C177930",term:"Intervention Type",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C179373",term:"Rescreening",guidance:`Describe screen failure and indicate how screen failure will be handled in the trial, including conditions and criteria under which rescreening is acceptable. If applicable, indicate the circumstances and time window under which a repeat procedure is allowed for screen failure relating to specific inclusion/exclusion criteria for the trial.`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C181232",term:"Version Date",guidance:`For use by the sponsor at their discretion.`,sections:["Amendment Details", "Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C181233",term:"Section # and Name",guidance:`?? Enter the section number and name from the protocol Table of Contents that this amendment row applies to. Required when an amendment is present.`,sections:["Amendment Details", "Section 12 \u2013 Other Protocol Considerations", "Title Page"],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C181236",term:"Full Title",guidance:`Insert the sponsor’s confidentiality statement, if applicable; otherwise delete.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C184390",term:"Description of Assent Process",guidance:`Specify the key elements of the informed consent process, including any special needs and how these are addressed (e.g., assent, capacity, legally acceptable representative, adolescents who may reach age of majority during the trial, pregnant participants and pregnant partners of participants).`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C184397",term:"References",guidance:`References should be listed in a common format that includes all relevant information to identify the source and date published. If a reference is not published, this should be clearly indicated.`,sections:["Section 14 \u2013 References"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C188853",term:"Other Intercurrent Event",guidance:`Description of the population-level summary (e.g., mean difference, relative risk).`,sections:["Objectives Block"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C188856",term:"Intercurrent Event Strategy",guidance:`Description of the strategy to address the intercurrent event (e.g., a treatment policy strategy); complete this to create the intercurrent event/strategy table.`,sections:["Objectives Block"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C188857",term:"Intercurrent Event Strategy",guidance:`Description of the strategy to address the intercurrent event (e.g., a treatment policy strategy); create separate fields for each intercurrent event if needed.`,sections:["Objectives Block"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C189349",term:"Measures to Maintain Blinding",guidance:`Describe measures that will be used to maintain blinding: • The investigational trial interventions are as indistinguishable as possible • Plans for the maintenance of randomisation codes and appropriate blinding for the trial • Procedures for planned (e.g., interim analysis) and unintentional (e.g., breach of procedure) breaking of randomisation codes For unplanned but intentional actions (e.g., safety events), refer to Section 6.7.4 Emergency Unblinding at the Site. If the trial allows for some investigators or other designated staff to remain unblinded (e.g., to allow them to adjust investigational trial intervention), the means of maintaining the blinding for other investigators or staff should be explained. Measures to prevent unblinding by laboratory measurements or while performing study assessments, if used, should be described.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C20108",term:"Sponsor's Investigational Product Code(s)",guidance:`?? For an amendment that does not apply to all sites in the trial, select "Not Global" and utilise one of the identifiers based on amendment scope.`,sections:["Amendment Details", "Title Page"],appAuthored:true,needsClarif:false,hasGuidance:true},
  {code:"C20989",term:"Physical Examination",guidance:`Include any specific instructions for the collection and interpretation of physical examinations.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C215629",term:"Rationale for Intervention Model",guidance:`Provide a rationale for the trial intervention model described in Section 4.1 Description of Trial Design with a cross reference to Section 6.2 Rationale for Investigational Trial Intervention Dose and Regimen. Rationale for choice of comparator, if applicable, should be described separately in Section 4.2.3 Rationale for Control Type. A rationale for the choice of trial population should be described separately in Section 5.1 Description of Trial Population and Rationale.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C217358",term:"Adverse Events of Special Interest",guidance:`Specify any AESI, including: • any event (serious or nonserious) of scientific and medical concern relative to the trial intervention, for which ongoing monitoring and rapid communication by the investigator to the sponsor can be appropriate •    other events that merit reporting to the sponsor, trial leadership, IRB, and regulatory agencies Include the following for each AESI: •    the definition •    the approach for ascertaining information • if applicable, any approach to confirm or adjudicate the event`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218475",term:"Randomisation Type",guidance:`Intervention Assignment Method: If applicable, describe the type of randomisation to be used (e.g., simple randomisation, block randomisation). If applicable, describe the other intervention assignment method`,sections:["Section 1 \u2013 Protocol Identification"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218476",term:"Definitions of Adverse Events",guidance:`Specify the AE definitions, including: • any relevant regional AE requirements • any events that meet and do not meet the AE definition • any trial-specific AE clarifications • if applicable, any clarifications on the AE and SAE definitions for efficacy trials (e.g., lack of efficacy or failure of pharmacological actions)`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218477",term:"Amendment Scope",guidance:`Enter the amendment identifier (e.g., amendment number). If this is the original instance of the protocol enter N/A.`,sections:["Amendment Details", "Section 12 \u2013 Other Protocol Considerations", "Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218478",term:"Amendment Scope Enrollment Definition",guidance:`Enter the approximate number or percentage of participants enrolled as a percentage of the expected total sample size. Enter the actual number enrolled at the time of data lock or trial completion when applicable.`,sections:["Amendment Details", "Section 12 \u2013 Other Protocol Considerations", "Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218479",term:"Section Number and Name",guidance:`?? Select the section number and name from the protocol Table of Contents affected by this amendment row.`,sections:["Amendment Details", "Section 12 \u2013 Other Protocol Considerations", "Title Page"],appAuthored:true,needsClarif:false,hasGuidance:true},

  {code:"C218677",term:"Sponsor Name / Sponsor Legal Address",guidance:`Provide the legal name and address of the individual or pharmaceutical or medical device company, governmental agency, academic institution, private organisation, or other organisation who takes primary responsibility for and initiates a clinical investigation. If more than one sponsor, list the primary sponsor in the Sponsor Name and Sponsor Legal Address fields. If co-sponsor is applicable, enter co-sponsor name and legal address. Add additional fields if more than one co-sponsor is applicable.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},

  {code:"C218679",term:"Local Sponsor Name and Address",guidance:`Provide the legal name and address of the individual or pharmaceutical or medical device company, governmental agency, academic institution, private organisation, or other organisation who takes primary responsibility for and initiates a clinical investigation. If more than one sponsor, list the primary sponsor in the Sponsor Name and Sponsor Legal Address fields. If co-sponsor is applicable, enter co-sponsor name and legal address. Add additional fields if more than one co-sponsor is applicable.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218680",term:"Local Sponsor Legal Address",guidance:`In some countries, the clinical trial Sponsor may be the local affiliate company (or designee). In such cases, indicate this in the Local Sponsor Name and Address Field.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218681",term:"Device Manufacturer Name and Address",guidance:`In some countries, the clinical trial sponsor may be the local affiliate company (or designee). In such cases, indicate this in the Local Sponsor Name and Local Sponsor Legal Address Fields.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218682",term:"Device Manufacturer Legal Address",guidance:`Manufacturer name and address information is required only for drug/device combination protocols that include investigational device(s) and should not be included for other protocols. Include the manufacturer address only if the manufacturer is different than the sponsor listed above. Add additional fields as needed if multiple investigational devices will be used in the trial or if there are multiple manufacturers for a single device. Delete this line if not applicable.`,sections:["Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},

  {code:"C218694",term:"Current Amendment",guidance:`Choose the applicable statement below. For an original protocol that has not been amended, retain the first statement below and delete the remainder of this entire section. {This protocol has not been amended.} Or {This is the first protocol amendment.} Or include the below {This protocol has been amended previously. Details of prior amendments are presented in Section 12.3 Prior Protocol Amendment(s).}`,sections:["Amendment Details", "Title Page"],appAuthored:false,needsClarif:false,hasGuidance:true},

  {code:"C218718",term:"Other Committees",guidance:`Indicate whether any committee(s) will be reviewing data while the trial is ongoing, and the type of committee. Common examples include Data Monitoring Committee, Dose Escalation Committee, or Endpoint Adjudication Committee; describe others, if applicable. List independent committees in the space indicated. Other committees may be included in the separate space provided. Committees listed here should be fully described in Section 11.4 Committees.`,sections:[],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218719",term:"Other Committees",guidance:``,sections:["Section 1 \u2013 Protocol Identification"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218720",term:"Schema Notes",guidance:`The purpose of this section is to provide a visual depiction of the trial design, orienting users of the protocol to the key features of the design. The schema depicts the trial arms, the flow of individual participant through the progression of trial period(s)/epochs (such as screening, washout/run-in, intervention, and key milestones [e.g., randomisation, cross-over, end of treatment, end of study, post-treatment follow-up]). For complex trials, additional schemas may be added to describe activities or trial periods in greater detail.`,sections:["Section 1 \u2013 Protocol Identification"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218721",term:"Trial-specific Intervention Risks and Mitigations",guidance:`Trial Intervention – Describe risks related to trial-specific treatments and interventions. For the protocol, focus on the relevant key risks for this trial. Provide a brief description of strategies to mitigate identified risks or provide a cross reference to the relevant protocol section.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218722",term:"Trial-specific Other Risks and Mitigations",guidance:`Trial Procedures – Describe risks associated with the design (e.g., placebo arm) and procedures specific to this trial (e.g., biopsies), and any measures to control or mitigate the risks. Provide a brief description of strategies to mitigate identified risks or provide a cross-reference to the relevant protocol section. This is not intended to be an exhaustive list of all possible risks associated with trial procedures but should focus on the unique risks inherent in the design or less common or high-risk procedures.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218723",term:"Trial-specific Other Risks and Mitigations",guidance:`Other – Consider risks associated with other items (e.g., challenge agents, imaging agents, medical devices). This could include discussion of risk mitigation for special populations, if not described elsewhere. Insert a line for each, as needed.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218724",term:"Benefit Summary",guidance:`The benefit summary should describe any physical, psychological, social, or other potential benefits to individual participants as a result of participating in the trial, addressing immediate potential benefits and/or long-range potential benefits. Clearly state if no benefits to an individual participant can be anticipated, or if potential benefits are unknown. For early clinical trials such as Phase 1 or trials in healthy participants, benefits for an individual participant (other than those of altruism) are expected to be minimal. Benefits to society in general may also be included but should be described separately from the individual participant perspective.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218725",term:"Overall Risk-Benefit Assessment",guidance:`Provide a succinct, concluding statement on the perceived balance between risks that have been identified from cumulative safety data, protocol procedures, and anticipated efficacy/benefits within the context of the proposed trial.`,sections:["Section 2 \u2013 Protocol Summary"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218726",term:"Description of Method of Assignment to Trial Intervention",guidance:`Describe the trial duration with reference to Section 1.2 Trial Schema. Explain what the overall duration for an individual participant is anticipated to be and why, including the sequence and duration of trial periods (e.g., screening, run-in, randomisation, treatment [fixed dose/titration], follow-up/washout periods). Where applicable, include discussion of sentinel dosing (or lack thereof), dose escalation, and cohort expansion. If dose modification decisions are dependent upon review by a committee, include details in Section 11.4 Committees.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218727",term:"Additional Description of Trial Design",guidance:`State the method of assignment to trial intervention and the level and method of blinding that will be used, with cross reference to Section 6.7 Investigational Trial Intervention Assignment, Randomisation and Blinding.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218728",term:"Additional Description of Trial Design",guidance:`Describe any other important aspects of the design, e.g.: • geographic scope of trial (e.g., single-centre, multicentre, or multicentre and multinational) • use of decentralised elements in the trial • planned use of a Data Monitoring Committee, or similar review group and cross reference Section 11.4 Committees, for details • whether an interim analysis is planned; if so, refer to details in Section 10.9 Interim Analyses • any planned extension trial, long-term follow-up/registry, future use of samples or data, or post-trial sample analysis or other data-related activities`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218729",term:"Stakeholder Input into Design",guidance:`If applicable, describe any stakeholder (e.g., patient, healthcare professional and patient advocacy groups) involvement in the design of the trial and any suggestions implemented.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218730",term:"Rationale for Estimand(s)",guidance:`When estimands are associated with the Primary and Secondary Objectives described in Section 3 Trial Objectives and Associated Estimands, provide a rationale for the estimand(s) not described elsewhere in the document. This should include a rationale that the selected endpoint(s) are clinically relevant and provide a reliable and valid measurement of the intended intervention effect(s). It should also include a rationale for the selected strategies for handling intercurrent events.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218731",term:"Rationale for Control Type",guidance:`If applicable, provide a rationale for the type and choice of control selected for the trial (e.g., placebo, active drug, combination, external). Describe any known or potential problems associated with the control group selected in light of the specific disease and intervention(s) being studied. If comparators will differ by region, describe. The rationale for dose and/or dose regimen is explained in Section 6.2 Rationale for Investigational Trial Intervention Dose and Regimen.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218732",term:"Rationale for Trial Duration",guidance:`Provide a rationale that the trial duration is appropriate for a reliable and relevant evaluation of the trial intervention per the trial objective(s).`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218733",term:"Rationale for Adaptive or Novel Trial Design",guidance:`If applicable, provide a rationale for the use of an adaptive or novel design.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218734",term:"Rationale for Interim Analysis",guidance:`If applicable, provide a rationale for any interim analysis planned with respect to its purpose (e.g., stopping the trial early for efficacy or futility) and timing.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218735",term:"Rationale for Other Trial Design Aspects",guidance:`Discuss rationale for any additional aspects of the design not addressed above.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218736",term:"End of Trial",guidance:`Define key timepoints in the trial, including trial start and end definitions (e.g., a key timepoint definition for start of trial might be when the ICF is signed by the first participant, and a key timepoint definition for end of trial might be when participants are no longer being examined or the last participant’s last trial assessment has occurred). Consider local regulatory requirements for these and other definitions (e.g., the first act of recruitment). If appropriate, provide a cross reference to Section 11.11 Early Site Closure.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218737",term:"End of Trial",guidance:`Define key timepoints in the trial, including trial start and end definitions (e.g., a key timepoint definition for start of trial might be when the informed consent is signed by the first participant, and a key timepoint definition for end of trial might be when participants are no longer being examined or the last participant’s last trial assessment has occurred). If applicable, consider local regulatory requirements for these and other definitions (e.g., the first act of recruitment). If appropriate, provide a cross reference to Section 11.11 Early Site Closure.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218738",term:"Access to Trial Intervention After End of Trial",guidance:`If applicable, describe any possibilities for access to trial intervention, if any, beyond completion of the trial. Planned extension trials, if described in Section 4.1 Description of Trial Design, do not need to be repeated in this section.`,sections:["Section 4 \u2013 Trial Objectives & Endpoints"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218739",term:"Description of Trial Population and Rationale",guidance:``,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218740",term:"Definitions Related to Childbearing Potential",guidance:`Specify the definitions of: • participant of childbearing potential • participant of nonchildbearing potential`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218741",term:"Contraception Requirements",guidance:`Specify the: • contraceptive methods required • duration of use`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218742",term:"Lifestyle Restrictions",guidance:`In the following subsections, describe any restrictions during the trial pertaining to lifestyle and/or diet, intake of caffeine, alcohol, or tobacco, or physical and other activities. If not applicable, include a statement that no restrictions are required.`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218743",term:"Meals and Dietary Restrictions",guidance:`If applicable, describe any restrictions on diet (e.g., food and drink restrictions, timing of meals relative to dosing, etc.).`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218744",term:"Caffeine, Alcohol, Tobacco, and Other Restrictions",guidance:`If applicable, describe any restrictions on the intake of caffeine, alcohol, tobacco, or other restrictions.`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218745",term:"Physical Activity Restrictions",guidance:`If applicable, describe any restrictions on physical activity (e.g., participants may be required to remain in bed for 4 to 6 hours after dosing).`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218746",term:"Other Activity Restrictions",guidance:`If applicable, describe restrictions on any other activity (e.g., blood or tissue donation, driving, heavy machinery use, or sun exposure).`,sections:["Section 5 \u2013 Overall Design"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218747",term:"Arm Name",guidance:`Trial interventions are all pre-specified investigational and noninvestigational medicinal products, medical devices or other interventions intended for the participants during the trial. The investigational trial intervention is the product(s) used in the trial as part of trial objectives, including control(s) (e.g., active comparator, placebo). Description of the investigational trial intervention is provided in Section 6.1 Description of Investigational Trial Intervention. Other trial interventions that are not part of trial objectives or do not have an investigational role in this trial are described in Section 6.9 Description of Noninvestigational Trial Intervention. Any regional requirements should be noted in the appropriate subsections. Provide an overview of investigational and noninvestigational trial interventions. Designate the trial intervention as IMP or NIMP/AxMP based on trial design and regional requirements. Consider the optional table below.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218748",term:"IMP or NIMP",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218749",term:"Sourcing",guidance:``,sections:[],appAuthored:false,needsClarif:false,hasGuidance:false},
  {code:"C218751",term:"Description of Investigational Trial Intervention",guidance:`Describe the investigational trial intervention to be administered in each arm of the trial and for each period of the trial including route and mode of administration, dose, dosage regimen, duration of intervention, use, packaging and labelling. Refer to approved regional labelling, as appropriate. For investigational drug/device combination products, include details on the configuration and use of the device and device manufacturer. A device user manual may be referenced in this section.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218752",term:"Rationale for Investigational Trial Intervention Dose and Regimen",guidance:`Provide a rationale for the selection of the dose(s) or dose range, pharmaceutical dose form, route of administration, and dosing regimen of the investigational trial interventions, as applicable. This rationale should include relevant results from nonclinical studies and clinical trials that support selection of the dose and regimen. Discuss impact of differences in trial population characteristics (e.g., age, sex, race) that could lead to differences in pharmacokinetics and pharmacodynamics in this trial as compared to previous trials. If applicable, justify any differences in dose regimen or therapeutic use relative to approved labelling. Describe prior trials and other information that support the dose and/or dose regimen of the investigational trial intervention. Include a rationale for prospective dose adjustments incorporated in the trial, if any.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218753",term:"Investigational Trial Intervention Administration",guidance:`Describe the detailed procedures for administration of each participant’s dose of each investigational trial intervention. This may include the timing of dosing (e.g., time of day, interval), the duration (e.g., the length of time participants will be administered the investigational trial intervention), and the timing of dosing relative to meals. Include any specific instructions on who, when or how to prepare and take the dose(s) and how to handle any delayed or missed doses. Dose escalation or cohort expansion as part of the overall design should be covered in Section 4.1 Description of Trial Design.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218754",term:"Investigational Trial Intervention Dose Modification",guidance:`For each participant, describe any dose modifications allowed, including conditions for such dose modifications, particularly regarding failure to respond or safety concerns. State any minimum period required before a participant’s dose might be raised to the next higher dose or dose range. Include whether it is permissible to start and stop treatment and how dose reductions (if permitted) are to be managed. Information on stopping investigational trial intervention for participants due to safety/other reasons should be described in Section 7 Participant Discontinuation of Trial Intervention and Discontinuation or Withdrawal from Trial.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218755",term:"Management of Investigational Trial Intervention Overdose",guidance:`Describe what is meant by investigational trial intervention overdose. Provide any available information on managing overdose and ensure it is consistent with the Investigator’s Brochure or product labelling. Cross reference these documents as applicable.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218756",term:"Participant Assignment to Investigational Trial Intervention",guidance:`State that at enrollment, participant identification codes should be assigned. Describe the method of assigning participants to investigational trial intervention without being so specific that blinding or randomisation might be compromised. If assignment to investigational trial intervention is by randomisation, describe when randomisation will occur relative to screening. If permuted block randomisation is employed, do not state the block size in the protocol. If adaptive randomisation or other methods of covariate balancing/minimisation are employed, include a cross reference to the methods of analysis in Section 10 Statistical Considerations. As applicable, details regarding the implementation of procedures to minimise bias should be described.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218757",term:"Emergency Unblinding at the Site",guidance:`Describe the criteria for breaking the trial blind or participant code. Describe the circumstances that would require breaking the blind, either for an individual participant or for all participants, and specify who will be responsible for this decision. Include the procedure for emergency unblinding as well as documentation of unblinding. Indicate to whom the intentional and unplanned unblinding should be reported.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218758",term:"Investigational Trial Intervention Adherence",guidance:`Describe the measures to monitor and document participants’ adherence to investigational trial intervention (e.g., trial intervention accountability records, paper or electronic diaries, or investigational trial intervention concentration measurements). List what documents are mandatory to complete (e.g., participant drug log) and identify which records will be used as the source records for documenting investigational trial intervention adherence.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218759",term:"Description of Noninvestigational Trial Intervention",guidance:`As stated in Section 6 Trial Intervention and Concomitant Therapy, noninvestigational interventions are pre-specified products used in the trial but are not part of trial objectives and hence, are not investigational trial interventions.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218761",term:"Other Noninvestigational Trial Intervention",guidance:`If applicable, describe the use of any other noninvestigational trial intervention (e.g., challenge agents or diagnostics).`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218762",term:"Prohibited Concomitant Therapy",guidance:`If applicable, describe any prohibited concomitant therapy.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218763",term:"Permitted Concomitant Therapy",guidance:`If applicable, describe any permitted concomitant therapy.`,sections:["Section 6 \u2013 Trial Population"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218764",term:"Permanent Discontinuation of Trial Intervention",guidance:`Describe: • the criteria for discontinuation of a participant from any trial intervention, carefully evaluating which are appropriate for the trial population and therapy being studied • how participants who discontinue trial intervention will be followed after discontinuation. Depending on the chosen intercurrent event handling strategy, it will be important to continue to follow and ascertain outcomes in participants who discontinue trial intervention through the end of the trial to prevent missing data in important analyses. Refer to Section 1.3 Schedule of Activities for assessments to be performed at the time of and following discontinuation of trial intervention • the process for collecting and recording the detailed reasons for discontinuing trial intervention if not described elsewhere`,sections:["Section 7 \u2013 Treatments"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218765",term:"Temporary Discontinuation of Trial Intervention",guidance:`Describe: • the criteria for temporary discontinuation or interruption of trial intervention for an individual participant • what to do and which restrictions still apply if the participant has to temporarily discontinue or interrupt trial intervention • which assessments will be performed for the stated duration of the trial Details of any rechallenge or restart after temporary discontinuation of trial intervention due to a safety-related event should be included in Section 7.1.3 Rechallenge.`,sections:["Section 7 \u2013 Treatments"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218766",term:"Rechallenge",guidance:`Describe the criteria for rechallenge/restarting trial intervention, how and when to perform rechallenge, the number of rechallenges allowed during the trial, and whether all, or specify which, assessments will be performed for the stated duration of the trial. If rechallenge is not allowed, state this.`,sections:["Section 7 \u2013 Treatments"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218767",term:"Participant Discontinuation or Withdrawal from Trial",guidance:`Describe the criteria for participant discontinuation or withdrawal from the trial. Describe the reason for withdrawal and the type of data to be collected for the final assessments with reference to the schedule of activities for the participant’s end of study visit unless provided in another section. In many cases, the only reason for a participant being considered withdrawn from the trial should be a participant’s withdrawal of consent to continue to participate in the trial. All other participants, including those who discontinue trial intervention, should remain in the trial and continue to be followed to prevent missing data in important analyses. Refer to Section 10 Statistical Considerations for the data that must be collected for the trial estimands.`,sections:["Section 7 \u2013 Treatments"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218768",term:"Management of Loss to Follow-Up",guidance:`Describe how the trial will define how participants are lost to follow-up. In general, participants should be considered lost to follow-up only if they cannot be reached despite multiple attempts to contact them. Also describe approaches that will be used to minimise loss to follow-up, such as multiple, diverse methods to remain in contact with participants (e.g., telephone calls, texts, and emails to the participant) and how contacts will be recorded.`,sections:["Section 7 \u2013 Treatments"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218769",term:"Trial Assessments and Procedures Considerations",guidance:`Describe general considerations applicable across trial assessments and procedures.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218770",term:"Baseline Assessments and Procedures",guidance:`Describe any assessments and procedures that are unique to screening/baseline (e.g., collection of data on participant characteristics, assessments/procedures performed for the purpose of determining eligibility or for stratification) in this section. Describe screening and baseline assessments and procedures separately when screening and baseline are different or performed at different visits.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218771",term:"Baseline Assessments and Procedures",guidance:`Describe any assessments and procedures that are unique to screening/baseline (e.g., collection of data on participant characteristics, assessments/procedures performed for the purpose of determining eligibility or for stratification) in this section. Describe screening and baseline assessments and procedures separately when screening and baseline are different or performed at different visits.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218772",term:"Efficacy Assessments and Procedures",guidance:`Describe efficacy assessments and procedures in this section. Cross reference Section 8.7 Immunogenicity Assessments if immunogenicity assessments are used in efficacy determination.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218773",term:"Safety Assessments and Procedures",guidance:`Describe safety assessments and procedures utilising the following subsections as applicable. Add level 3 headings as needed. •   Identify any noninvestigator party involved in the evaluation of laboratory or other safety assessments (e.g., sponsor or external Independent Data Monitoring Committee; cross reference Section 11.4 Committees for details as applicable). •   Include guidelines for the medical management of relevant laboratory or other safety assessment abnormalities.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218774",term:"Clinical Laboratory Assessments",guidance:`Describe any specific instructions for the collection and interpretation of clinical laboratory assessments, including: •    type of laboratory (central/local/hybrid) •    acceptability of additional tests deemed necessary by the investigator or local regulations •    instructions for situations in which central laboratory results are not available in time for trial intervention and/or response evaluation, or in the event of a severe disruption (e.g., a pandemic or natural disaster) •    treatment algorithms for results out of normal range •    cross reference Section 12.1 Clinical Laboratory Tests for laboratory assessment panels`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218775",term:"Suicidal Ideation and Behaviour Risk Monitoring",guidance:`If the trial meets any of the criteria requiring suicidal ideation and behaviour risk monitoring by the guidance/guideline in each region, include justification for the need for suicidal ideation and behaviour risk monitoring in the study and add any specific instructions for the collection and interpretation of the assessment. In case this is an AESI in the study, justification should also be provided in Section 9.2.4 Adverse Events of Special Interest.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218776",term:"Pharmacokinetics",guidance:`Include any specific instructions for the collection and assay of samples and interpretation of PK assessments. •     Describe the biological samples collected, the handling of samples, and the assay method. o    Specific sample collection and processing instructions can be described in an appendix or a separate document and cross referenced. •     Describe the retention time for the samples (ensuring alignment with the ICF). •     Indicate the types of analyses for each sample. • Define the PK parameters to be calculated and the calculation methods.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218777",term:"Genetics, Genomics, Pharmacogenetics and Pharmacogenomics",guidance:`Include any specific instructions for the collection and assay of samples for genetic, genomics, pharmacogenetics and/or pharmacogenomic analysis. •    Describe the biological samples that will be collected (e.g., tissue, serum, plasma), handling of samples, and the assay method. o Specific sample collection and processing instructions can be described in an appendix or a separate document and cross referenced. •    Describe the retention time for the samples (ensuring alignment with the ICF). • Indicate the types of analyses that may be studied for each sample.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218778",term:"Pharmacodynamic Biomarkers",guidance:`Include any specific instructions for the collection of samples and assessment of pharmacodynamic biomarkers. •    Describe the biological samples that will be collected (e.g., tissue, serum, plasma). o Specific sample collection and processing instructions can be described in an appendix or a separate document and cross referenced. •    Describe the retention time for the samples (ensuring alignment with the ICF). •    Indicate the types of biomarkers that will be studied for each sample. •    Specify whether each sample is optional or required. Required samples must be based on a protocol objective.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218779",term:"Other Biomarkers",guidance:`Include any specific instructions for the collection of samples and assessment of other biomarkers. •    Describe the biological samples that will be collected (e.g., tissue, serum, plasma). o Specific sample collection and processing instructions can be described in an appendix or a separate document and cross referenced. •    Describe the retention time for the samples (ensuring alignment with the ICF). •    Indicate the types of biomarkers that will be studied for each sample. •    Specify whether each sample is optional or required. Required samples must be based on a protocol objective.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218780",term:"Immunogenicity Assessments",guidance:`Include any specific instructions for the collection of samples and interpretation of immunogenicity. If immunogenicity assessments are included within Section 8.3 Efficacy Assessments and Procedures or Section 8.4 Safety Assessments and Procedures, cross reference that section. •    Describe the biological samples that will be collected (e.g., tissue, serum, plasma). o Specific sample collection and processing instructions can be described in an appendix or a separate document and cross referenced. •    Describe the retention time for the samples (ensuring alignment with the ICF). •   Indicate the types of biomarkers that will be studied for each sample. •   Specify whether each sample is optional or required. Required samples must be based on a protocol objective.`,sections:["Section 8 \u2013 Assessments & Procedures"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218781",term:"Definitions of Serious Adverse Events",guidance:`Specify the SAE definitions, including: • any relevant regional SAE requirements • any events that meet and do not meet the SAE definition • any trial-specific SAE clarifications`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218782",term:"Definitions of Product Complaints",guidance:`Specify the definitions of product complaints in the context of the trial.`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:false,needsClarif:false,hasGuidance:true},
  {code:"C218783",term:"Definitions of Medical Device Product Complaints",guidance:`?? Provide the definition of Medical Device Product Complaints as they apply to this trial, consistent with the definition in Section 9.1.3 Product Complaints.`,sections:["Section 9 \u2013 Safety Reporting"],appAuthored:true,needsClarif:false,hasGuidance:true},
